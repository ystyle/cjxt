[package]
cjc-version = "1.1.0"
name = "cjxt"
description = "Cangjie server-driven UI framework for enterprise applications"
version = "1.0.2"
output-type = "static"
compile-option = "-Woff unused"
link-option = ""
# 制品清单（include/exclude 用 gitignore 风格的模式）：
#   include：只装"编译这个库需要的东西" —— 框架源码 + 编译期被 @EmbedString 读取的
#            CSS / 客户端 JS（少了消费方编译不过）
#   exclude：挡掉开发期目录（文档站 / 示例 / 测试工程 / 脚本）
# 少了 include，整棵工作树都会进制品（docs-site/ 整个站点 + examples/ + tests/ + AGENTS.md）。
include = ["src", "public/css/element-plus.css", "public/js/*"]
exclude = ["scripts", "examples", "docs", "docs-site", "tests"]
license = ["MIT"]
authors = ["ystyle"]
category = ["UI", "Infrastructure"]
homepage = "https://ystyle.top/cjxt"
documentation = "https://ystyle.top/cjxt"
repository = "https://atomgit.com/ystyle/cjxt"


[package.package-configuration."cjxt.components"]
compile-option = "--debug-macro"

[target.x86_64-unknown-linux-gnu]
# stdx.net.http 的 WebSocket 握手（SHA1）需要 digest 库（对齐 mcp-cj/atelier）
link-option = "-L${CANGJIE_STDX_PATH} -lstdx.crypto.digest"
[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-apple-darwin.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-w64-mingw32.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.aarch64-linux-ohos.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-linux-ohos.bin-dependencies]
path-option = ["${CANGJIE_STDX_PATH}"]

[dependencies]
tang = "1.0.4"
embed = "1.0.7"
"opencj::ulid" = "0.1.2"
markit = "0.0.4"

[test-dependencies]
